name: expense_manager
description: "Proactive Expense Manager — hybrid Local/Cloud Flutter app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Local persistence
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # Identity
  uuid: ^4.5.1

  # Networking
  http: ^1.2.2

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # UX
  shimmer: ^3.0.0
  lottie: ^3.3.0
  intl: ^0.20.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
